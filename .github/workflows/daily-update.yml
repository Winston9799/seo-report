name: Daily SEO report update

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 09:30 GMT+8 every day — edit this to change the time
  workflow_dispatch:        # adds a "Run workflow" button so you can trigger it by hand too
    inputs:
      full_refresh:
        description: "Full refresh (re-fetch every archived month instead of just the recent ones — use after a data/filter change, or before a quarterly persona review)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GA4 + Search Console data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "seo-report-bot"
          git config user.email "actions@github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git push
