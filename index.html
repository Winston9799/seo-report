<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Report</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<header>
  <div class="brand-title" id="brand-title">SEO Report</div>
  <div class="header-controls">
    <div class="brand-tabs" id="brand-tabs">
      <button data-brand="anzo" class="active">Anzo</button>
      <button data-brand="dlsm">DLSM</button>
    </div>
    <div class="month-picker">
      <label for="month-current">Month</label>
      <select id="month-current"></select>
      <label for="month-compare">vs.</label>
      <select id="month-compare"></select>
    </div>
  </div>
  <div class="meta-line" id="meta-line">Loading&hellip;</div>
</header>

<div class="container">

  <section style="margin-top:32px;">
    <div class="section-head">
      <h2>Trend</h2>
      <select id="metric-select" class="month-picker-inline">
        <option value="clicks">Clicks</option>
        <option value="impressions">Impressions</option>
        <option value="sessions">Sessions (GA4)</option>
        <option value="position">Position</option>
      </select>
    </div>
    <div style="background:var(--white); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px;">
      <canvas id="trend-chart" height="90"></canvas>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Executive summary</h2>
      <span class="section-note" id="period-note"></span>
    </div>
    <div class="kpi-row" id="kpi-row"></div>
    <div class="kpi-row" id="kpi-row-ga4" style="margin-top:16px;"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Branded vs. non-branded</h2>
      <span class="section-note">Share of total clicks</span>
    </div>
    <div id="split-section"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Top keyword movers</h2>
      <span class="section-note">Biggest click changes between the two selected months</span>
    </div>
    <div id="movers-table"></div>
  </section>

  <section>
    <div class="two-col">
      <div>
        <div class="section-head"><h2>Branded keywords</h2></div>
        <div id="branded-table"></div>
      </div>
      <div>
        <div class="section-head"><h2>Non-branded keywords</h2></div>
        <div id="nonbranded-table"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="section-head"><h2>Top pages by clicks</h2></div>
    <div id="pages-table"></div>
  </section>

  <section>
    <div class="two-col">
      <div>
        <div class="section-head"><h2>Top countries</h2></div>
        <div id="countries-table"></div>
      </div>
      <div>
        <div class="section-head"><h2>Device split</h2></div>
        <div id="device-split"></div>
      </div>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
